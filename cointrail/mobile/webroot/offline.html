<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Offline — Cointrail</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0b0f;
        color: #e6e6e6;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      main {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 360px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        color: #9b9ba3;
        margin: 0 0 20px;
        line-height: 1.5;
      }
      button {
        background: #10b981;
        color: #06131a;
        border: 0;
        border-radius: 10px;
        padding: 12px 18px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
      }
      button:active {
        transform: translateY(1px);
      }
      .hint {
        margin-top: 24px;
        font-size: 12px;
        color: #6a6a74;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <h1>You're offline</h1>
        <p>
          Cointrail needs a connection to your Vault7A server to load. Check your Wi-Fi or VPN, then
          retry.
        </p>
        <button onclick="location.reload()">Retry</button>
        <div class="hint">SMS ingestion keeps running in the background.</div>
      </div>
    </main>
  </body>
</html>
